[project]
name = "ai-dj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "essentia==2.1b6.dev1389",
    "joblib>=1.5.3",
    "langchain-openai>=1.5.1",
    "langchain-openrouter>=0.2.9,<0.3",
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "soundfile>=0.14.0",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
# Sandbox experiments only (src/experiments/); never part of the production install.
# mlx-whisper is Apple-Silicon-only.
experiments = [
    "demucs>=4.0.1",
    "httpx",
    "huggingface-hub",
    "indic-transliteration",
    "matplotlib>=3.11.2",
    "mlx-whisper",
    "rapidfuzz",
    "ytmusicapi",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
